<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM Assist - Web Chat</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; }
        #chat-widget {
            position: fixed; bottom: 20px; right: 20px;
            width: 350px; height: 500px;
            background: white; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; overflow: hidden;
        }
        #chat-header {
            background: #007bff; color: white; padding: 15px;
            font-weight: bold; text-align: center;
        }
        #chat-messages {
            flex: 1; padding: 15px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .message { padding: 8px 12px; border-radius: 15px; max-width: 80%; line-height: 1.4; }
        .bot { background: #e9ecef; align-self: flex-start; border-bottom-left-radius: 2px; white-space: pre-wrap; }
        .user { background: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        #chat-input-area { padding: 10px; display: flex; border-top: 1px solid #eee; }
        #chat-input { flex: 1; border: 1px solid #ddd; padding: 8px; border-radius: 5px; outline: none; }
        #chat-send { background: #007bff; color: white; border: none; padding: 8px 15px; margin-left: 5px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-widget">
    <div id="chat-header">FM Assist Chatbot</div>
    <div id="chat-messages">
        <div class="message bot">Hello! I am FM Assist. Please provide the store or branch name you are reporting from.</div>
    </div>
    <div id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
        <button id="chat-send">Send</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const sessionId = 'session-' + Math.random().toString(36).substr(2, 9);

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = 'message ' + (isUser ? 'user' : 'bot');
        div.textContent = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage(text, true);
        chatInput.value = '';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-fm-secret': 'YOUR_WIDGET_SECRET' // This will match your .env
                },
                body: JSON.stringify({ sessionId, message: text })
            });
            const data = await response.json();
            addMessage(data.reply, false);
        } catch (error) {
            addMessage("Error: Could not connect to the server.", false);
        }
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>

</body>
</html>
