<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Assist — Fault Reporting Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0A1F44; --navy-deep: #061530; --teal: #028090; --teal-glow: rgba(2,128,144,.18);
  --mint: #02C39A; --mint-soft: rgba(2,195,154,.12); --gold: #F7B731; --red: #E53935;
  --surface: #F6F8FC; --border: rgba(10,31,68,.08); --border2: rgba(10,31,68,.14);
  --text: #1A2B4A; --muted: #6B7A99; --white: #FFFFFF; --shadow-sm: 0 2px 8px rgba(10,31,68,.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--surface); height: 100vh; display: flex; flex-direction: column; }
.fm-widget { background: var(--white); display: flex; flex-direction: column; height: 100vh; width: 100%; overflow: hidden; position: relative; }
.fm-header { background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 60%, #1a3a6e 100%); padding: 16px 20px; flex-shrink: 0; }
.fm-header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.fm-logo { width: 36px; height: 36px; background: linear-gradient(135deg, var(--teal), var(--mint)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.fm-logo svg { width: 20px; height: 20px; }
.fm-brand { flex: 1; }
.fm-brand-name { font-size: 14px; font-weight: 600; color: var(--white); }
.fm-brand-sub { font-size: 10px; color: rgba(255,255,255,.55); }
.fm-status { display: flex; align-items: center; gap: 4px; background: rgba(29,185,84,.15); border: 1px solid rgba(29,185,84,.25); border-radius: 99px; padding: 2px 8px; }
.fm-status-dot { width: 5px; height: 5px; border-radius: 50%; background: #1DB954; }
.fm-status-text { font-size: 10px; color: #1DB954; font-weight: 500; }
.fm-cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.fm-cats::-webkit-scrollbar { display: none; }
.fm-cat { flex-shrink: 0; display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); border-radius: 99px; padding: 4px 10px; font-size: 11px; color: rgba(255,255,255,.8); cursor: pointer; transition: 0.15s; white-space: nowrap; }
.fm-cat:hover { background: var(--teal); color: var(--white); }
.fm-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; background: var(--white); scroll-behavior: smooth; }
.fm-msg { display: flex; gap: 8px; align-items: flex-end; animation: msgIn 0.25s ease; }
.fm-msg.bot { align-self: flex-start; max-width: 90%; }
.fm-msg.user { align-self: flex-end; flex-direction: row-reverse; max-width: 85%; }
.fm-avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--mint)); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--white); }
.fm-bubble { padding: 8px 12px; font-size: 13px; line-height: 1.5; color: var(--text); border-radius: 14px; position: relative; word-wrap: break-word; }
.fm-msg.bot .fm-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.fm-msg.user .fm-bubble { background: var(--navy); color: var(--white); border-bottom-right-radius: 4px; }
.fm-options { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.fm-opt { padding: 4px 10px; font-size: 12px; border: 1px solid var(--border2); border-radius: 99px; background: white; cursor: pointer; transition: 0.15s; }
.fm-opt:hover { border-color: var(--teal); color: var(--teal); }
.fm-typing { padding: 10px 12px; background: var(--surface); border-radius: 14px; display: flex; gap: 4px; align-self: flex-start; margin-left: 32px; margin-bottom: 10px; }
.fm-dot { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: blink 1.4s infinite both; }
.fm-dot:nth-child(2) { animation-delay: 0.2s; }
.fm-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
.fm-inputbar { padding: 10px 15px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: flex-end; }
.fm-input { flex: 1; border: 1.5px solid var(--border2); border-radius: 18px; padding: 8px 14px; font-size: 13px; background: var(--surface); outline: none; resize: none; max-height: 80px; }
.fm-send { width: 34px; height: 34px; border-radius: 50%; background: var(--teal); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.fm-send:disabled { opacity: 0.5; cursor: default; }
.fm-send svg { width: 16px; height: 16px; fill: white; }
@keyframes msgIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="fm-widget">
  <div class="fm-header">
    <div class="fm-header-top">
      <div class="fm-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </div>
      <div class="fm-brand">
        <div class="fm-brand-name">FM Assist</div>
        <div class="fm-brand-sub">Facilities Management</div>
      </div>
      <div class="fm-status"><div class="fm-status-dot"></div><span class="fm-status-text">Online</span></div>
    </div>
    <div class="fm-cats">
      <button class="fm-cat" onclick="fmSend('Log a fault')">🔧 Log fault</button>
      <button class="fm-cat" onclick="fmSend('Categories')">📋 Categories</button>
      <button class="fm-cat" onclick="fmSend('SLAs')">⏱️ SLAs</button>
    </div>
  </div>
  <div class="fm-messages" id="fm-messages"></div>
  <div id="fm-typing-container"></div>
  <div class="fm-inputbar">
    <textarea class="fm-input" id="fm-input" rows="1" placeholder="Type a message..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();fmSend()}"></textarea>
    <button class="fm-send" id="fm-btn" onclick="fmSend()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
  </div>
</div>
<script>
const BACKEND_URL = '/api/chat';
const WIDGET_SECRET = 'FM_ASSIST_SECRET';
const SESSION_ID = 'web_' + Math.random().toString(36).slice(2, 9);
let isBusy = false;

function addMsg(text, type, opts = []) {
  const msgs = document.getElementById('fm-messages');
  const wrap = document.createElement('div');
  wrap.className = 'fm-msg ' + type;
  if (type === 'bot') wrap.innerHTML = '<div class="fm-avatar">FM</div>';
  const bubble = document.createElement('div');
  bubble.className = 'fm-bubble';

  // Format report if detected
  const formatted = text.includes('━━━')
    ? `<div style="font-family:'DM Mono',monospace;font-size:11px;background:rgba(2,128,144,.05);padding:10px;border-radius:8px;border:1px solid rgba(2,128,144,.1)">${text.replace(/\n/g, '<br>')}</div>`
    : text.replace(/\n/g, '<br>');

  bubble.innerHTML = formatted;

  if (opts.length > 0) {
    const or = document.createElement('div'); or.className = 'fm-options';
    opts.forEach(o => {
      const b = document.createElement('button'); b.className = 'fm-opt'; b.textContent = o;
      b.onclick = () => fmSend(o); or.appendChild(b);
    });
    bubble.appendChild(or);
  }
  wrap.appendChild(bubble); msgs.appendChild(wrap); msgs.scrollTop = msgs.scrollHeight;
}

function showTyping(show) {
  const container = document.getElementById('fm-typing-container');
  container.innerHTML = show ? '<div class="fm-typing"><div class="fm-dot"></div><div class="fm-dot"></div><div class="fm-dot"></div></div>' : '';
  const msgs = document.getElementById('fm-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

async function fmSend(val) {
  const input = document.getElementById('fm-input');
  const text = val || input.value.trim();
  if (!text || isBusy) return;
  if (!val) input.value = '';
  addMsg(text, 'user');

  isBusy = true;
  document.getElementById('fm-btn').disabled = true;
  showTyping(true);

  try {
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-fm-secret': WIDGET_SECRET },
      body: JSON.stringify({ sessionId: SESSION_ID, message: text })
    });
    const data = await res.json();
    showTyping(false);

    // Extract options from bot reply
    let opts = [];
    const lines = data.reply.split('\n');

    // Check for numbered lists: "1. Option"
    const numbered = lines
      .filter(l => /^\d+\.\s/.test(l.trim()))
      .map(l => l.replace(/^\d+\.\s+/, '').split('—')[0].split('→')[0].trim().substring(0, 35));

    // Check for "Options: Yes / No" format
    const optLine = lines.find(l => l.toLowerCase().startsWith('options:'));
    const slashOpts = optLine ? optLine.split(':')[1].split('/').map(o => o.trim()) : [];

    opts = [...numbered, ...slashOpts];

    addMsg(data.reply, 'bot', opts);
  } catch (e) {
    showTyping(false);
    addMsg("Connection error. Please try again.", "bot");
  } finally {
    isBusy = false;
    document.getElementById('fm-btn').disabled = false;
    input.focus();
  }
}

window.onload = () => {
  // Initial message triggered via backend to ensure session setup
  fmSend('START_BOT');
};
</script>
</body>
</html>
