<!-- ── FM ASSIST FLOATING WIDGET SNIPPET ── -->
<div id="fm-widget-root"></div>
<script>
(function() {
  const BACKEND_URL = 'https://cs-fm-assist.vercel.app/api/chat';
  const WIDGET_SECRET = 'FM_ASSIST_SECRET';

  // Inject the widget iframe
  const container = document.getElementById('fm-widget-root');
  const iframe = document.createElement('iframe');
  iframe.src = 'https://cs-fm-assist.vercel.app/embed.html';
  iframe.style.position = 'fixed';
  iframe.style.bottom = '24px';
  iframe.style.right = '24px';
  iframe.style.width = '420px';
  iframe.style.height = '650px';
  iframe.style.border = 'none';
  iframe.style.zIndex = '10000';
  iframe.style.borderRadius = '24px';
  iframe.style.boxShadow = '0 8px 48px rgba(10,31,68,.14)';

  // Responsive sizing
  const updateSize = () => {
    if (window.innerWidth < 480) {
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.bottom = '0';
      iframe.style.right = '0';
      iframe.style.borderRadius = '0';
    } else {
      iframe.style.width = '420px';
      iframe.style.height = '650px';
      iframe.style.bottom = '24px';
      iframe.style.right = '24px';
      iframe.style.borderRadius = '24px';
    }
  };

  window.addEventListener('resize', updateSize);
  updateSize();
  container.appendChild(iframe);
})();
</script>
