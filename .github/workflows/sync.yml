name: Sync to SouthAfricasSoul

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout Target
        uses: actions/checkout@v4
        with:
          repository: southafricassoul/SouthAfricasSoul
          token: ${{ secrets.SYNC_TOKEN }}
          path: target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Sync Files
        run: |
          # Create api directory in target if it doesn't exist
          mkdir -p target/api

          # Remove old chatbot files in api to prevent conflicts
          rm -f target/api/*.js
          rm -f target/api/*.cjs
          rm -f target/api/webhook/*.js
          rm -f target/api/webhook/*.cjs

          # Copy chatbot logic
          cp -r source/api/* target/api/

          # Copy embed.html to root AND public/ (for Vite compatibility)
          # We force create public/ because Vite projects need static assets there
          mkdir -p target/public
          cp source/embed.html target/public/
          cp source/embed.html target/

          # Handle vercel.json rewrites safely using external script
          if [ -f "target/vercel.json" ]; then
            python3 source/.github/scripts/update_vercel_json.py target/vercel.json
          else
            cp source/vercel.json target/
          fi

          # Update dependencies in package.json
          if [ -f "target/package.json" ]; then
            python3 source/.github/scripts/update_package_json.py target/package.json source/package.json
          fi

          # Update index.html with the new launcher using BeautifulSoup
          # We check for index.html in root and src/ (common Vite locations)
          if [ -f "target/index.html" ]; then
            python3 source/.github/scripts/update_index.py target/index.html source/index.html
          elif [ -f "target/src/index.html" ]; then
             python3 source/.github/scripts/update_index.py target/src/index.html source/index.html
          fi

      - name: Commit and Push
        run: |
          cd target
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Sync chatbot components from CS_FM_ASSIST and fix UI overlap"
          git push origin main
